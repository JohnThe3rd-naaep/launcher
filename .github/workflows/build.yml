name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q Launcher.zip
          cd Launcher
          sh scripts/setup_zsign.sh
          brew install xcodegen
          xcodegen
          xcodebuild -project Launcher.xcodeproj -scheme Launcher -configuration Release -sdk iphoneos -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Launcher.app Payload/
          zip -qr Launcher.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-ipa
          path: Launcher.ipa
